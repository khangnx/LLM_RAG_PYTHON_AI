networks:
  rag-network:
    driver: bridge

services:
  # 1. AI Engine: Chạy Ollama local phục vụ RAG offline
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-network
    restart: unless-stopped
    # Nếu máy bạn có GPU NVIDIA, hãy mở comment 6 dòng dưới để kích hoạt:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Kéo ngầm model qwen2.5:7b khi khởi động
  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: ollama_pull_model
    networks:
      - rag-network
    depends_on:
      - ollama
    entrypoint: [ "sh", "-c", "sleep 10 && curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:7b\"}'" ]

  # 2. Database: MySQL 8.0 lưu lịch sử chat
  mysql:
    image: mysql:8.0
    container_name: mysql_rag
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: rag_demo_db
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # 3. ChromaDB Vector Store Server
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb_server
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - vector_db_data:/data
    networks:
      - rag-network
    restart: unless-stopped

  # 4. Backend Service: Python FastAPI kết nối LangChain & ChromaDB & MySQL
  backend:
    build: ./backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data_source:/data_source
      - ./sales_uploads:/sales_uploads
      - vector_db_data:/vector_db
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=mysql+pymysql://root:root_password@mysql:3306/rag_demo_db
      - OPENAI_API_KEY=your_openai_key_here
      - SALES_UPLOADS_DIR=/sales_uploads
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_HTTP_PORT=8000
    networks:
      - rag-network
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped

  # 5. Frontend Service: Giao diện người dùng VueJS + Element Plus
  frontend:
    build: ./frontend
    container_name: vuejs_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - rag-network
    depends_on:
      - backend
    restart: unless-stopped

  # 6. Giao diện quản lý trực quan cho ChromaDB
  chromadb-ui:
    image: nginx:alpine
    container_name: chromadb_html_ui
    ports:
      - "8090:80"
    volumes:
      - ./chroma_ui_dash:/usr/share/nginx/html:ro
    networks:
      - rag-network
    depends_on:
      - backend
    restart: unless-stopped

  # 7. n8n: Workflow Automation + AI Agent
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Ho_Chi_Minh
      - OLLAMA_HOST=http://ollama:11434
      - N8N_RESTRICT_FILE_ACCESS_TO=/data_source
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data_source:/data_source
    networks:
      - rag-network
    depends_on:
      - ollama
      - chromadb
    restart: unless-stopped

volumes:
  ollama_data:
  mysql_data:
  vector_db_data:
  n8n_data: